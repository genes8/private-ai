name: Release

# Closed-runtime release pipeline (roadmap Phase E).
# Triggered by version tags (v1.2.3). Gates: backend tests, frontend build,
# vulnerability scan, SBOM, dependency/license report. Publishes versioned,
# immutable images to GHCR plus a GitHub release carrying the evidence
# artifacts that feed the enterprise security pack.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/safe4ai-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/safe4ai-frontend

jobs:
  gates:
    name: Test gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe4ai-pilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Backend tests
        run: pytest tests/ -q

      - name: Audit dependencies
        run: pip-audit --skip-editable --desc

      - name: Dependency license report (backend)
        run: |
          python -m pip install pip-licenses
          pip-licenses --format=markdown --with-urls --output-file=license-report-backend.md

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build
        working-directory: safe4ai-pilot/frontend
        run: |
          npm ci
          npm run build

      - name: Dependency license report (frontend)
        working-directory: safe4ai-pilot/frontend
        run: npx license-checker --production --markdown > ../license-report-frontend.md

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: |
            safe4ai-pilot/license-report-backend.md
            safe4ai-pilot/license-report-frontend.md

  images:
    name: Build, scan, and publish images
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$BACKEND_IMAGE:$VERSION" \
            -f safe4ai-pilot/app/Dockerfile safe4ai-pilot

      - name: Build frontend image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$FRONTEND_IMAGE:$VERSION" \
            safe4ai-pilot/frontend

      - name: Vulnerability scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Vulnerability scan (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: SBOM (backend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          upload-artifact: false

      - name: SBOM (frontend)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          upload-artifact: false

      - name: Push images (immutable version tags only)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "$BACKEND_IMAGE:$VERSION"
          docker push "$FRONTEND_IMAGE:$VERSION"

      - name: Download license reports
        uses: actions/download-artifact@v4
        with:
          name: license-reports
          path: release-evidence/license-reports

      - name: Create GitHub release with evidence artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-evidence/license-reports/license-report-backend.md
            release-evidence/license-reports/license-report-frontend.md
            sbom-backend.spdx.json
            sbom-frontend.spdx.json
            trivy-backend.sarif
            trivy-frontend.sarif
