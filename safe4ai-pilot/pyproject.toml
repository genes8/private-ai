[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe4ai-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.136.1",
    "starlette==1.0.1",
    "uvicorn[standard]==0.34.2",
    "python-multipart==0.0.27",
    "langgraph==1.1.10",
    "langgraph-checkpoint==4.0.0",
    "langchain==1.2.18",
    "langchain-community==0.4.1",
    "langchain-ollama==1.1.0",
    "langchain-qdrant==1.1.0",
    "langsmith==0.8.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.12.0",
    "sqlalchemy==2.0.41",
    "pgvector==0.3.6",
    "alembic==1.15.2",
    "qdrant-client==1.17.1",
    "PyJWT[crypto]==2.13.0",
    "httpx==0.28.1",
    "idna==3.15",
    "rank-bm25==0.2.2",
    "opentelemetry-sdk==1.33.0",
    "opentelemetry-exporter-otlp==1.33.0",
    "bcrypt>=4.0.0",
    "slowapi==0.1.9",
    "python-magic==0.4.27",
    "secure==0.3.0",
    "structlog==25.3.0",
    "sentence-transformers==5.4.1",
    "torch==2.11.0",
    "transformers==5.8.0",
    "aiohttp==3.14.0",
    "pypdf==6.12.0",
    "pdf2image==1.17.0",
    "docx2txt==0.8",
    "openpyxl==3.1.5",
    "pillow==12.2.0",
    "APScheduler==3.11.0",
    "psycopg2-binary==2.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==6.1.0",
    "pytest-env==1.1.5",
    "ruff==0.11.9",
    "mypy==1.15.0",
    "pip-audit==2.9.0",
    "testcontainers[postgres,qdrant]==4.9.2",
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "observability*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/migrate.py" = ["S603"]
"scripts/backup.py" = ["S603", "S607"]
"tests/**/*.py" = ["S101"]
"evaluation/**/*.py" = ["E501", "S608", "S112"]

[tool.mypy]
strict = true
ignore_missing_imports = true
disable_error_code = ["var-annotated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
env = [
    "OTEL_SDK_DISABLED=true",
]
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
markers = [
    "integration: tests that require Docker/Testcontainers or real services",
    "smoke: real docker-compose service checks; set RUN_REAL_SMOKE=1 after docker compose up",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*", "evaluation/*"]
