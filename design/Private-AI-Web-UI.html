<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>private·ai — Web UI</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="styles.css"/>

  <style>
    html, body, #root { height: 100%; margin: 0; }
    body {
      font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
      background: #f0eee9;
      color: #14161a;
    }
  </style>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Canvas + tweaks shell -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Components -->
  <script type="text/babel" src="components/Icons.jsx"></script>
  <script type="text/babel" src="components/Foundations.jsx"></script>
  <script type="text/babel" src="components/Login.jsx"></script>
  <script type="text/babel" src="components/ChatShared.jsx"></script>
  <script type="text/babel" src="components/ChatA.jsx"></script>
  <script type="text/babel" src="components/ChatB.jsx"></script>
  <script type="text/babel" src="components/ChatStates.jsx"></script>
  <script type="text/babel" src="components/AdminShell.jsx"></script>
  <script type="text/babel" src="components/AdminDocs.jsx"></script>
  <script type="text/babel" src="components/AdminAudit.jsx"></script>
  <script type="text/babel" src="components/AdminStats.jsx"></script>
  <script type="text/babel" src="components/AdminFeedback.jsx"></script>

  <!-- App -->
  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#3b6cf2",
      "density": "regular",
      "showCanvasGrid": true
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

      // Apply accent color globally
      React.useEffect(() => {
        document.documentElement.style.setProperty('--blue', t.accent);
        // Recompute soft tints
        const hex = t.accent.replace('#','');
        const r = parseInt(hex.slice(0,2),16);
        const g = parseInt(hex.slice(2,4),16);
        const b = parseInt(hex.slice(4,6),16);
        document.documentElement.style.setProperty('--blue-soft',
          `rgba(${r},${g},${b},0.10)`);
        document.documentElement.style.setProperty('--blue-tint',
          `rgba(${r},${g},${b},0.05)`);
      }, [t.accent]);

      // Density tuning
      React.useEffect(() => {
        document.documentElement.style.setProperty('--pa-density-scale',
          t.density === 'compact' ? '0.94' : t.density === 'comfy' ? '1.06' : '1');
      }, [t.density]);

      const Foundations    = window.Foundations;
      const Login          = window.Login;
      const ChatA          = window.ChatA;
      const ChatB          = window.ChatB;
      const ChatEmpty      = window.ChatEmpty;
      const ChatStreaming  = window.ChatStreaming;
      const ChatCiteHover  = window.ChatCiteHover;
      const AdminDocs      = window.AdminDocs;
      const AdminAudit     = window.AdminAudit;
      const AdminStats     = window.AdminStats;
      const AdminFeedback  = window.AdminFeedback;

      return (
        <>
          <DesignCanvas
            title="private·ai"
            subtitle="Phase 4 — Web UI · pilot user chat + admin panel"
          >
            <DCSection id="brand" title="01 · Foundations" subtitle="Tone, palette and primitives the rest of the work is built from.">
              <DCArtboard id="found" label="Brand foundations" width={1280} height={720}>
                <Foundations/>
              </DCArtboard>
            </DCSection>

            <DCSection id="auth" title="02 · Sign in" subtitle="A single quiet entry point. SSO-first, password second.">
              <DCArtboard id="login" label="Login · split" width={1280} height={780}>
                <Login/>
              </DCArtboard>
            </DCSection>

            <DCSection id="chat" title="03 · Chat — pilot user" subtitle="Two takes on the same conversation, side-by-side.">
              <DCArtboard id="chat-a" label="A · Centered, citation drawer" width={1280} height={820}>
                <ChatA/>
              </DCArtboard>
              <DCArtboard id="chat-b" label="B · Three-pane workbench" width={1440} height={820}>
                <ChatB/>
              </DCArtboard>
            </DCSection>

            <DCSection id="chat-states" title="04 · Chat — micro-interactions" subtitle="Empty state with corpus-aware prompts, streaming pipeline view, and the inline citation hover preview.">
              <DCArtboard id="empty" label="Empty state · suggested prompts" width={1280} height={820}>
                <ChatEmpty/>
              </DCArtboard>
              <DCArtboard id="stream" label="Streaming · pipeline visible" width={1280} height={820}>
                <ChatStreaming/>
              </DCArtboard>
              <DCArtboard id="cite" label="Citation hover · PDF peek" width={1280} height={780}>
                <ChatCiteHover/>
              </DCArtboard>
            </DCSection>

            <DCSection id="admin" title="05 · Admin" subtitle="Reframed as a calm document store + activity log + briefing — not a tile dashboard.">
              <DCArtboard id="admin-docs" label="Documents · upload + indexing" width={1440} height={820}>
                <AdminDocs/>
              </DCArtboard>
              <DCArtboard id="admin-audit" label="Activity · stream view" width={1440} height={820}>
                <AdminAudit/>
              </DCArtboard>
              <DCArtboard id="admin-stats" label="Overview · daily briefing" width={1280} height={820}>
                <AdminStats/>
              </DCArtboard>
              <DCArtboard id="admin-feedback" label="Feedback · trace review" width={1440} height={820}>
                <AdminFeedback/>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Accent"/>
            <TweakColor label="Action color" value={t.accent}
              options={['#3b6cf2', '#1f8a5b', '#7a5ae0', '#c66338', '#0a0a0a']}
              onChange={(v) => setTweak('accent', v)} />
            <TweakSection label="Density"/>
            <TweakRadio label="Spacing" value={t.density}
              options={['compact', 'regular', 'comfy']}
              onChange={(v) => setTweak('density', v)} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
